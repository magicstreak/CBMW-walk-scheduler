<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaborative Booking Calendar</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-muted: #f8fafc;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-muted: #64748b;
            
            /* Grade Colors */
            --color-E: #16a34a;
            --color-M: #2563eb;
            --color-MS: #dc2626;
            --color-S: #111827;
            --color-VS: #7c3aed;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f1f5f9;
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
/* Top Page Header Styling */
        .page-header {
            text-align: center;
            margin-bottom: 32px;
            width: 100%;
            max-width: 950px;
        }

        .page-header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-main);
            margin: 0 0 8px 0;
            letter-spacing: -0.03em;
        }

        .page-header p {
            font-size: 1.05rem;
            color: var(--text-muted);
            margin: 0;
        }
        .calendar-container {
            width: 100%;
            max-width: 1000px;
            background: #fff;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .calendar-header h2 {
            margin: 0;
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .nav-btn {
            background: #fff;
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            color: var(--text);
        }

        .nav-btn:hover {
            background: var(--bg-muted);
            border-color: #cbd5e1;
        }

        .legend-container {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            padding: 12px;
            background: var(--bg-muted);
            border-radius: 8px;
            width: 100%;
            box-sizing: border-box;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 4px;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }

        .day-cell {
            border: 1px solid var(--border);
            border-radius: 10px;
            min-height: 130px;
            padding: 10px;
            background: #fff;
            display: flex;
            flex-direction: column;
            transition: border-color 0.2s;
        }

        .day-cell.empty {
            background: var(--bg-muted);
            border: none;
        }

        .day-number {
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: #334155;
        }

        .slots-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
        }

        /* Base Slot Styling */
        .slot {
            padding: 6px 8px;
            font-size: 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Past State Styling */
        .slot.past {
            background-color: #f1f5f9 !important;
            color: #94a3b8 !important;
            border-color: #e2e8f0 !important;
            cursor: not-allowed;
            opacity: 0.6;
            box-shadow: none !important;
        }

        /* --- AVAILABLE SLOTS STYLE (Palered Grade Specific Color) --- */
        /* --- AVAILABLE SLOTS STYLE (Pale Grade Background, Neutral Gray Text & Border) --- */
        .slot.available {
            font-weight: 500;
            color: #64748b !important;       /* Slate-Gray text for readability */
            border: 1px solid #cbd5e1;       /* Soft Gray border outline */
        }
        
        /* Retain individual low-opacity background color tints under the neutral text */
        .slot.available.grade-E  { background-color: rgba(22, 163, 74, 0.12); }
        .slot.available.grade-M  { background-color: rgba(37, 99, 235, 0.12); }
        .slot.available.grade-MS { background-color: rgba(220, 38, 38, 0.12); }
        .slot.available.grade-S  { background-color: rgba(17, 24, 39, 0.06); }
        .slot.available.grade-VS { background-color: rgba(124, 58, 237, 0.12); }

        .slot.available:hover:not(.past) {
            background-color: #cbd5e1 !important; /* Shorthand hover background update */
            color: #1e293b !important;            /* Darker slate-gray text on hover */
            border-color: #94a3b8;
        }

        /* --- BOOKED SLOTS STYLE (Bolder Solid Grade Specific Color) --- */
        .slot.booked {
            font-weight: 700;
            color: #ffffff;
            border: 1px solid transparent;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.15);
        }
        .slot.booked.grade-E  { background-color: var(--color-E);  border-color: var(--color-E); }
        .slot.booked.grade-M  { background-color: var(--color-M);  border-color: var(--color-M); }
        .slot.booked.grade-MS { background-color: var(--color-MS); border-color: var(--color-MS); }
        .slot.booked.grade-S  { background-color: var(--color-S);  border-color: var(--color-S); }
        .slot.booked.grade-VS { background-color: var(--color-VS); border-color: var(--color-VS); }

        .slot.booked:hover:not(.past) {
            filter: brightness(1.1);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        /* Modal styling */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #fff;
            padding: 32px;
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }

        .modal-content h3 {
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #334155;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 0.95rem;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-group input[readonly] {
            background-color: var(--bg-muted);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 28px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .btn-secondary {
            background: var(--bg-muted);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        /* Admin Section Styling */
        .admin-container {
            width: 100%;
            max-width: 1000px;
            background: #fff;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .admin-header h3 {
            margin: 0;
            font-size: 1.35rem;
            font-weight: 700;
        }

        .table-wrapper {
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background-color: var(--bg-muted);
            color: var(--text-muted);
            padding: 14px 16px;
            font-weight: 700;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            color: var(--text);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.75rem;
            color: white;
            display: inline-block;
        }

        .btn-danger {
            background-color: #ef4444;
            color: white;
            padding: 6px 12px;
            font-size: 0.85rem;
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        .btn-success {
            background-color: #10b981;
            color: white;
        }

        .btn-success:hover {
            background-color: #059669;
        }

        .btn-warning {
            background-color: #f59e0b;
            color: white;
        }

        .btn-warning:hover {
            background-color: #d97706;
        }
    </style>
</head>
<body>
<!-- Added Header and Instruction Section -->
    <header class="page-header">
        <h1>CBMW Walk Scheduler</h1>
        <p>Click on a slot to schedule or edit a walk.</p>
    </header>
    <div class="calendar-container">
        <div class="calendar-header">
            <button class="nav-btn" id="prev-month">&larr; Previous</button>
            <h2 id="calendar-title">Month Year</h2>
            <button class="nav-btn" id="next-month">Next &rarr;</button>
        </div>

        <div class="legend-container">
            <div class="legend-item"><div class="legend-dot" style="background-color: var(--color-E);"></div>E (Easy)</div>
            <div class="legend-item"><div class="legend-dot" style="background-color: var(--color-M);"></div>M (Moderate)</div>
            <div class="legend-item"><div class="legend-dot" style="background-color: var(--color-MS);"></div>MS (Moderate S)</div>
            <div class="legend-item"><div class="legend-dot" style="background-color: var(--color-S);"></div>S (Strenuous)</div>
            <div class="legend-item"><div class="legend-dot" style="background-color: var(--color-VS);"></div>VS (Very Strenuous)</div>
        </div>
        
        <div class="weekdays">
            <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>
        
        <div class="days-grid" id="days-grid"></div>
    </div>

    <div class="admin-container">
        <div class="admin-header">
            <h3>Administration Dashboard</h3>
            <div style="display: flex; gap: 8px;">
                <button class="btn btn-success" id="export-csv">Export to CSV</button>
                <button class="btn btn-warning" id="clear-all">Clear All Bookings</button>
                <button class="btn btn-sucess" id="publish">Publish Shedule</button>
            </div>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Grade</th>
                        <th>Walk Number</th>
                        <th>Leader Name</th>
                        <th>Comments</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="admin-table-body">
                    <!-- Rows injected here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Booking Modal -->
    <div class="modal-overlay" id="booking-modal">
        <div class="modal-content">
            <h3 id="modal-heading">Book Walk Slot</h3>
            <form id="kv-booking-form">
                <div class="form-group">
                    <label for="input-date">Selected Date</label>
                    <input type="text" id="input-date" name="date" readonly>
                </div>
                <div class="form-group">
                    <label for="input-grade">Walk Grade</label>
                    <input type="text" id="input-grade" name="walk_grade" readonly>
                </div>
                <div class="form-group">
                    <label for="input-walk-no">Walk Number</label>
                    <input type="text" id="input-walk-no" name="walk_number" required placeholder="e.g. WK-104">
                </div>
                <div class="form-group">
                    <label for="input-leader">Name of Leader</label>
                    <input type="text" id="input-leader" name="leader_name" required placeholder="e.g. John Doe">
                </div>
                <div class="form-group">
                    <label for="input-comments">Comments</label>
                    <textarea id="input-comments" name="comments" placeholder="Add specific walk rules or route updates..."></textarea>
                </div>
                
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="close-modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Submit Booking</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDK Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // CONFIGURATION STEPS FOR COLLABORATIVE MODE:
        // Paste your own verified credentials below inside this config variable block.
       // const firebaseConfig = {
     //       apiKey: "YOUR_API_KEY",
   //         authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
   //         databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
  ///          projectId: "YOUR_PROJECT_ID",
  //          storageBucket: "YOUR_PROJECT_ID.appspot.com",
//            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
//            appId: "YOUR_APP_ID"
 //       };
        const firebaseConfig = {
          apiKey: "AIzaSyC0hEmdWHSlBkdnxrQiNt_RITYsbj3wvi0",
          authDomain: "cbmw-walk-scheduler.firebaseapp.com",
          databaseURL: "https://cbmw-walk-scheduler-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "cbmw-walk-scheduler",
          storageBucket: "cbmw-walk-scheduler.firebasestorage.app",
          messagingSenderId: "108766389213",
          appId: "1:108766389213:web:cded7ada3d32874b380c34",
          measurementId: "G-QFS6HHL007"
        };

        let db = null;
        let isFirebaseActive = false;

        // Auto validation structure checking configuration elements
        if (firebaseConfig.apiKey !== "YOUR_API_KEY" && firebaseConfig.databaseURL.indexOf("YOUR_PROJECT_ID") === -1) {
            try {
                const app = initializeApp(firebaseConfig);
                db = getDatabase(app);
                isFirebaseActive = true;
                console.log("Firebase Global Database Live Status Connected successfully.");
            } catch (err) {
                console.error("Firebase startup structural failure. Falling back to Local Simulator Mode.", err);
            }
        }

        if (!isFirebaseActive) {
            console.warn("Using Offline Local Simulator Mode. Operations locked locally to this machine.");
        }

        const grades = ["E", "M", "MS", "S", "VS"];
        let currentDate = new Date(); // Hardlocked explicitly to base calendar tracking metrics year 2026
        let globalBookings = {};

        const monthNames = [
            "January", "February", "March", "April", "May", "June", 
            "July", "August", "September", "October", "November", "December"
        ];

        const daysGrid = document.getElementById('days-grid');
        const calendarTitle = document.getElementById('calendar-title');
        const modal = document.getElementById('booking-modal');
        const bookingForm = document.getElementById('kv-booking-form');
        const adminTableBody = document.getElementById('admin-table-body');
        const modalHeading = document.getElementById('modal-heading');

        // Load sync dataset actions
        function initDataSync() {
            if (isFirebaseActive) {
                const dbRef = ref(db, 'walk_bookings');
                onValue(dbRef, (snapshot) => {
                    const data = snapshot.val();
                    globalBookings = data ? data : {};
                    renderCalendar();
                    renderAdminTable();
                });
            } else {
                const localData = localStorage.getItem('global_walk_bookings');
                globalBookings = localData ? JSON.parse(localData) : {};
                renderCalendar();
                renderAdminTable();
            }
        }

        function saveBookingRecord(key, data) {
            if (data === null) {
                delete globalBookings[key];
            } else {
                globalBookings[key] = data;
            }

            if (isFirebaseActive) {
                set(ref(db, 'walk_bookings/' + key), data);
            } else {
                localStorage.setItem('global_walk_bookings', JSON.stringify(globalBookings));
                renderCalendar();
                renderAdminTable();
            }
        }

        function clearAllRecords() {
            if (confirm("Are you sure you want to delete EVERY record in the dataset globally?")) {
                if (isFirebaseActive) {
                    remove(ref(db, 'walk_bookings'));
                } else {
                    globalBookings = {};
                    localStorage.removeItem('global_walk_bookings');
                    renderCalendar();
                    renderAdminTable();
                }
            }
        }

        function renderCalendar() {
            daysGrid.innerHTML = '';
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            calendarTitle.innerText = `${monthNames[month]} ${year}`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();
            const today = new Date(); // Reference standard boundary for 2026 updates

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.classList.add('day-cell', 'empty');
                daysGrid.appendChild(emptyCell);
            }

            for (let day = 1; day <= totalDays; day++) {
                const dayCell = document.createElement('div');
                dayCell.classList.add('day-cell');

                const dayNoDiv = document.createElement('div');
                dayNoDiv.classList.add('day-number');
                dayNoDiv.innerText = day;
                dayCell.appendChild(dayNoDiv);

                const specificDate = new Date(year, month, day);
                const dayOfWeek = specificDate.getDay();
                const slotsContainer = document.createElement('div');
                slotsContainer.classList.add('slots-container');

                // Dynamic generation matching constraints strictly (Wednesdays = 3, Saturdays = 6)
                if (dayOfWeek === 3 || dayOfWeek === 6) {
                    const dateISO = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                    const isPast = specificDate < today;

                    grades.forEach(grade => {
                        const slotEl = document.createElement('div');
                        slotEl.classList.add('slot', `grade-${grade}`);
                        const compositeKey = `${dateISO}_${grade}`;
                        const bookedData = globalBookings[compositeKey];

                        if (isPast) {
                            slotEl.classList.add('past');
                            if (bookedData) {
                                slotEl.innerText = `${grade} Booked: ${bookedData.walk_number}`;
                            } else {
                                slotEl.innerText = `${grade}`;
                            }
                        } else if (bookedData) {
                            slotEl.classList.add('booked');
                            slotEl.innerText = `${grade} Booked: ${bookedData.walk_number}`;
                            slotEl.title = `Leader: ${bookedData.leader_name} | Comments: ${bookedData.comments}`;
                            slotEl.addEventListener('click', () => {
                                openBookingModal(dateISO, grade, bookedData);
                            });
                        } else {
                            slotEl.classList.add('available');
                            slotEl.innerText = `${grade} Available`;
                            slotEl.addEventListener('click', () => {
                                openBookingModal(dateISO, grade);
                            });
                        }
                        slotsContainer.appendChild(slotEl);
                    });
                }
                dayCell.appendChild(slotsContainer);
                daysGrid.appendChild(dayCell);
            }
        }

        function renderAdminTable() {
            adminTableBody.innerHTML = '';
            const sortedKeys = Object.keys(globalBookings).sort();

            if (sortedKeys.length === 0) {
                adminTableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">No entries recorded inside the active synchronization stream yet.</td></tr>`;
                return;
            }

            sortedKeys.forEach(key => {
                const record = globalBookings[key];
                const tr = document.createElement('tr');
                
                let badgeColor = 'var(--color-E)';
                if (record.walk_grade === 'M') badgeColor = 'var(--color-M)';
                if (record.walk_grade === 'MS') badgeColor = 'var(--color-MS)';
                if (record.walk_grade === 'S') badgeColor = 'var(--color-S)';
                if (record.walk_grade === 'VS') badgeColor = 'var(--color-VS)';

                tr.innerHTML = `
                    <td><strong>${record.date}</strong></td>
                    <td><span class="badge" style="background-color: ${badgeColor}">${record.walk_grade}</span></td>
                    <td><code>${record.walk_number}</code></td>
                    <td>${record.leader_name}</td>
                    <td><small>${record.comments || '-'}</small></td>
                    <td>
                        <button class="btn btn-danger btn-sm" data-key="${key}">Cancel</button>
                    </td>
                `;

                tr.querySelector('.btn-danger').addEventListener('click', (e) => {
                    const targetKey = e.target.getAttribute('data-key');
                    if (confirm(`Cancel reservation for walk ${globalBookings[targetKey].walk_number}?`)) {
                        saveBookingRecord(targetKey, null);
                    }
                });

                adminTableBody.appendChild(tr);
            });
        }

        function openBookingModal(dateString, grade, existingData = null) {
            document.getElementById('input-date').value = dateString;
            document.getElementById('input-grade').value = grade;
            
            if (existingData) {
                modalHeading.innerText = "Edit Walk Parameters";
                document.getElementById('input-walk-no').value = existingData.walk_number;
                document.getElementById('input-leader').value = existingData.leader_name;
                document.getElementById('input-comments').value = existingData.comments || '';
            } else {
                modalHeading.innerText = "Book Walk Slot";
                bookingForm.reset();
                document.getElementById('input-date').value = dateString;
                document.getElementById('input-grade').value = grade;
            }
            
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
            bookingForm.reset();
        }

        bookingForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const dateStr = document.getElementById('input-date').value;
            const gradeStr = document.getElementById('input-grade').value;
            const compositeKey = `${dateStr}_${gradeStr}`;

            const payload = {
                date: dateStr,
                walk_grade: gradeStr,
                walk_number: document.getElementById('input-walk-no').value.trim(),
                leader_name: document.getElementById('input-leader').value.trim(),
                comments: document.getElementById('input-comments').value.trim()
            };

            saveBookingRecord(compositeKey, payload);
            closeModal();
        });

        document.getElementById('export-csv').addEventListener('click', () => {
            const keys = Object.keys(globalBookings).sort();
            if (keys.length === 0) {
                alert("No active data entries to export.");
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,Date,Walk Grade,Walk Number,Leader Name,Comments\n";
            keys.forEach(key => {
                const r = globalBookings[key];
                const row = [
                    `"${r.date}"`,
                    `"${r.walk_grade}"`,
                    `"${r.walk_number.replace(/"/g, '""')}"`,
                    `"${r.leader_name.replace(/"/g, '""')}"`,
                    `"${(r.comments || '').replace(/"/g, '""')}"`
                ].join(",");
                csvContent += row + "\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "walk_bookings_export.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        document.getElementById('prev-month').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById('next-month').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        document.getElementById('close-modal').addEventListener('click', closeModal);
        document.getElementById('clear-all').addEventListener('click', clearAllRecords);

        // Run Initial Setup Data Pipelines
        initDataSync();
    </script>
</body>
</html>
