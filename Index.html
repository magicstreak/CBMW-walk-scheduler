<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walk Booking Dashboard</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            
            /* Available Neutral State */
            --avail-bg: #f1f5f9;
            --avail-border: #cbd5e1;
            --avail-text: #475569;
            --avail-hover-bg: #e2e8f0;
            
            /* Booked Colors (Only applied when booked) */
            --color-e: #16a34a;
            --color-m: #2563eb;
            --color-ms: #dc2626;
            --color-s: #111827;
            --color-vs: #7c3aed;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dashboard-card {
            width: 100%;
            max-width: 950px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05), 0 2px 12px -4px rgba(15, 23, 42, 0.03);
            border: 1px solid var(--border);
            padding: 32px;
            margin-bottom: 32px;
            box-sizing: border-box;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }

        .header-section h2 {
            margin: 0;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .nav-controls {
            display: flex;
            gap: 8px;
        }

        .btn-nav {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        .btn-nav:hover {
            background: var(--avail-bg);
            border-color: var(--avail-border);
        }

        .weekdays-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
        }

        .day-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            min-height: 140px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            transition: border-color 0.2s ease;
        }

        .day-box.outside-month {
            background: #f8fafc;
            border-color: #f1f5f9;
            opacity: 0.4;
        }

        .day-title {
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .grades-stack {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
        }

        /* Base Slot Styles */
        .grade-slot {
            padding: 6px 8px;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 6px;
            text-align: center;
            box-sizing: border-box;
            transition: all 0.2s ease;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Available Neutral State */
        .grade-slot.available {
            background-color: var(--avail-bg);
            border: 1px solid var(--avail-border);
            color: var(--avail-text);
            cursor: pointer;
        }

        .grade-slot.available:hover {
            background-color: var(--avail-hover-bg);
            transform: translateY(-1px);
        }

        /* Booked Custom Color Overrides */
        .grade-slot.booked {
            border-style: dashed;
            cursor: not-allowed;
        }

        .grade-slot.booked.grade-e {
            background-color: rgba(22, 163, 74, 0.12);
            border: 1px dashed var(--color-e);
            color: var(--color-e);
        }
        .grade-slot.booked.grade-m {
            background-color: rgba(37, 99, 235, 0.12);
            border: 1px dashed var(--color-m);
            color: var(--color-m);
        }
        .grade-slot.booked.grade-ms {
            background-color: rgba(220, 38, 38, 0.12);
            border: 1px dashed var(--color-ms);
            color: var(--color-ms);
        }
        .grade-slot.booked.grade-s {
            background-color: rgba(17, 24, 39, 0.08);
            border: 1px dashed var(--color-s);
            color: var(--color-s);
        }
        .grade-slot.booked.grade-vs {
            background-color: rgba(124, 58, 237, 0.12);
            border: 1px dashed var(--color-vs);
            color: var(--color-vs);
        }

        /* Past Invalid State */
        .grade-slot.past {
            background-color: #f1f5f9;
            border: 1px dashed #cbd5e1;
            color: #94a3b8;
            opacity: 0.5;
            cursor: not-allowed;
            text-decoration: line-through;
        }

        /* Modal Overlay Framework */
        .modal-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.3);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 2000;
        }

        .modal-mask.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-window {
            background: var(--card-bg);
            padding: 28px;
            border-radius: 14px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
            border: 1px solid var(--border);
            box-sizing: border-box;
        }

        .modal-window h3 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .input-row {
            margin-bottom: 16px;
        }

        .input-row label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-main);
        }

        .input-row input, .input-row textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 0.9rem;
            font-family: inherit;
        }

        .input-row input:focus, .input-row textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .input-row input[readonly] {
            background-color: #f8fafc;
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .modal-foot {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 24px;
        }

        .btn-action {
            padding: 10px 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.15s ease;
        }

        .btn-cancel {
            background: #f1f5f9;
            color: var(--text-main);
        }

        .btn-cancel:hover {
            background: #e2e8f0;
        }

        .btn-submit {
            background: var(--primary);
            color: #ffffff;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
        }

        /* Database Table Dashboard Panel */
        .admin-panel {
            width: 100%;
            max-width: 950px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05);
            padding: 32px;
            box-sizing: border-box;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .admin-header h3 {
            margin: 0;
            font-size: 1.3rem;
            font-weight: 700;
        }

        .admin-actions {
            display: flex;
            gap: 10px;
        }

        .btn-panel-action {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border);
            background: white;
            transition: all 0.2s;
        }

        .btn-export {
            background: #f8fafc;
            color: var(--primary);
            border-color: rgba(79, 70, 229, 0.2);
        }

        .btn-export:hover {
            background: #eeebff;
        }

        .btn-clear-all {
            background: #fff5f5;
            color: #e53e3e;
            border-color: #fed7d7;
        }

        .btn-clear-all:hover {
            background: #fff5f5;
            border-color: #e53e3e;
        }

        .table-wrapper {
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background: #f8fafc;
            padding: 12px 16px;
            font-weight: 600;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            color: var(--text-main);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .btn-row-delete {
            background: #fff5f5;
            color: #c53030;
            border: 1px solid #feb2b2;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-row-delete:hover {
            background: #fed7d7;
            border-color: #c53030;
        }
    </style>
</head>
<body>

    <!-- Main Calendar Dashboard Card -->
    <div class="dashboard-card">
        <div class="header-section">
            <h2 id="calendar-title">Month Year</h2>
            <div class="nav-controls">
                <button class="btn-nav" id="btn-prev">&larr; Previous</button>
                <button class="btn-nav" id="btn-next">Next &rarr;</button>
            </div>
        </div>
        
        <div class="weekdays-grid">
            <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>
        
        <div class="calendar-grid" id="calendar-grid"></div>
    </div>

    <!-- Admin Operational Database Card -->
    <div class="admin-panel">
        <div class="admin-header">
            <h3>Registered Walks Database</h3>
            <div class="admin-actions">
                <button class="btn-panel-action btn-export" id="btn-csv-export">Export to CSV</button>
                <button class="btn-panel-action btn-clear-all" id="btn-purge-data">Clear All Bookings</button>
            </div>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Walk Grade</th>
                        <th>Walk Number</th>
                        <th>Leader Name</th>
                        <th>Comments</th>
                        <th style="width: 80px; text-align: center;">Action</th>
                    </tr>
                </thead>
                <tbody id="database-table-body">
                    <!-- Dynamic Database Rows -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Prefilled Key-Value Entry Pop-up Dialog -->
    <div class="modal-mask" id="booking-modal-mask">
        <div class="modal-window">
            <h3>Prefilled Walk Log</h3>
            <form id="walk-registry-form">
                <div class="input-row">
                    <label for="field-date">Selected Date</label>
                    <input type="text" id="field-date" name="date" readonly>
                </div>
                <div class="input-row">
                    <label for="field-grade">Walk Grade</label>
                    <input type="text" id="field-grade" name="walk_grade" readonly>
                </div>
                <div class="input-row">
                    <label for="field-walk-num">Walk Number</label>
                    <input type="text" id="field-walk-num" name="walk_number" required placeholder="e.g. WK-104">
                </div>
                <div class="input-row">
                    <label for="field-leader">Leader Name</label>
                    <input type="text" id="field-leader" name="leader_name" required placeholder="e.g. Sarah Jenkins">
                </div>
                <div class="input-row">
                    <label for="field-comments">Comments</label>
                    <textarea id="field-comments" name="comments" rows="3" placeholder="Add specific notes or track guidelines..."></textarea>
                </div>
                
                <div class="modal-foot">
                    <button type="button" class="btn-action btn-cancel" id="btn-close-modal">Cancel</button>
                    <button type="submit" class="btn-action btn-submit">Submit Walk</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Configuration Parameters
        const walkGrades = ["E", "M", "MS", "S", "VS"];
        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        
        // System state initialized explicitly to calendar timeline anchoring logic matching 2026 contexts
        let calendarPivotDate = new Date();
        const absoluteToday = new Date();

        // Structural Dom Cache 
        const calendarGrid = document.getElementById('calendar-grid');
        const calendarTitle = document.getElementById('calendar-title');
        const modalMask = document.getElementById('booking-modal-mask');
        const walkForm = document.getElementById('walk-registry-form');
        const tableBody = document.getElementById('database-table-body');

        // Storage Management Helpers
        function fetchBookings() {
            return JSON.parse(localStorage.getItem('walk_registry_db')) || {};
        }

        function persistBookings(db) {
            localStorage.setItem('walk_registry_db', JSON.stringify(db));
            renderCalendar();
            renderTable();
        }

        function createCompositeKey(dateString, grade) {
            return `${dateString}_${grade}`;
        }

        // Render Calendar Layout View
        function renderCalendar() {
            calendarGrid.innerHTML = '';
            const year = calendarPivotDate.getFullYear();
            const month = calendarPivotDate.getMonth();

            calendarTitle.innerText = `${monthNames[month]} ${year}`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();
            const db = fetchBookings();

            // Populate padding days from prior months
            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.classList.add('day-box', 'outside-month');
                calendarGrid.appendChild(emptyCell);
            }

            // Populate actual calendar day indices
            for (let day = 1; day <= totalDays; day++) {
                const dayBox = document.createElement('div');
                dayBox.classList.add('day-box');

                const dayNo = document.createElement('div');
                dayNo.classList.add('day-title');
                dayNo.innerText = day;
                dayBox.appendChild(dayNo);

                const currentCellDate = new Date(year, month, day);
                const dayOfWeek = currentCellDate.getDay(); // 3 = Wed, 6 = Sat
                
                // Clear time variables to allow exact normalized calendar comparisons
                const trackDate = new Date(year, month, day);
                trackDate.setHours(0,0,0,0);
                const normalizedToday = new Date(absoluteToday.getFullYear(), absoluteToday.getMonth(), absoluteToday.getDate());

                const stack = document.createElement('div');
                stack.classList.add('grades-stack');

                // Enforce restricted booking criteria (Saturdays and Wednesdays exclusively)
                if (dayOfWeek === 3 || dayOfWeek === 6) {
                    const formattedLocalDate = trackDate.toLocaleDateString();

                    walkGrades.forEach(grade => {
                        const slot = document.createElement('div');
                        slot.classList.add('grade-slot');
                        
                        const lookupKey = createCompositeKey(formattedLocalDate, grade);
                        const existingRecord = db[lookupKey];

                        if (trackDate < normalizedToday) {
                            // Past Date Handling
                            slot.classList.add('past');
                            slot.innerText = grade;
                        } else if (existingRecord) {
                            // Booked Handlers - Dynamic short name transformed to show the custom user-specified walk identifier
                            slot.classList.add('booked', `grade-${grade.toLowerCase()}`);
                            slot.innerText = `${grade}: ${existingRecord.walk_number}`;
                            slot.title = `Leader: ${existingRecord.leader_name} | ${existingRecord.comments}`;
                        } else {
                            // Open Available Handlers
                            slot.classList.add('available');
                            slot.innerText = grade;
                            slot.addEventListener('click', () => {
                                launchRegistrationModal(formattedLocalDate, grade);
                            });
                        }
                        stack.appendChild(slot);
                    });
                }

                dayBox.appendChild(stack);
                calendarGrid.appendChild(dayBox);
            }
        }

        // Render Database Management View
        function renderTable() {
            tableBody.innerHTML = '';
            const db = fetchBookings();
            const records = Object.keys(db).sort();

            if (records.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 24px;">No active walk reservations found in local database storage.</td></tr>`;
                return;
            }

            records.forEach(key => {
                const item = db[key];
                const tr = document.createElement('tr');
                
                tr.innerHTML = `
                    <td style="font-weight: 600;">${item.date}</td>
                    <td><span style="font-weight: 700; color: var(--color-${item.walk_grade.toLowerCase()});">${item.walk_grade}</span></td>
                    <td style="font-family: monospace; font-weight: 600;">${item.walk_number}</td>
                    <td>${item.leader_name}</td>
                    <td style="color: var(--text-muted); max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${item.comments}">${item.comments || '-'}</td>
                    <td style="text-align: center;">
                        <button class="btn-row-delete" data-key="${key}">Cancel</button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }

        // Modal Action Management
        function launchRegistrationModal(dateStr, gradeStr) {
            document.getElementById('field-date').value = dateStr;
            document.getElementById('field-grade').value = gradeStr;
            modalMask.classList.add('active');
            document.getElementById('field-walk-num').focus();
        }

        function hideRegistrationModal() {
            modalMask.classList.remove('active');
            walkForm.reset();
        }

        // Event Handling Bindings
        walkForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const formData = new FormData(walkForm);
            const walkPayload = {};
            
            formData.forEach((val, key) => {
                walkPayload[key] = val.trim();
            });

            const db = fetchBookings();
            const compositeKey = createCompositeKey(walkPayload.date, walkPayload.walk_grade);

            // Commit Record payload
            db[compositeKey] = walkPayload;
            persistBookings(db);
            hideRegistrationModal();
        });

        // Granular Row Cancellation Trigger Linkages
        tableBody.addEventListener('click', (e) => {
            if (e.target.classList.contains('btn-row-delete')) {
                const targetKey = e.target.getAttribute('data-key');
                if (confirm(`Are you sure you want to cancel the registration for this walk?`)) {
                    const db = fetchBookings();
                    delete db[targetKey];
                    persistBookings(db);
                }
            }
        });

        // Database CSV Compilation Macro
        document.getElementById('btn-csv-export').addEventListener('click', () => {
            const db = fetchBookings();
            const records = Object.keys(db).sort();
            
            if (records.length === 0) {
                alert("The registry database is empty. There is no row data available to compile.");
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,Date,Walk Grade,Walk Number,Leader Name,Comments\n";
            
            records.forEach(key => {
                const r = db[key];
                // Prevent comma-break corruptions inside cells via explicit string escaping wrappers
                const escapedComments = `"${(r.comments || '').replace(/"/g, '""')}"`;
                const escapedLeader = `"${(r.leader_name || '').replace(/"/g, '""')}"`;
                const escapedWalkNum = `"${(r.walk_number || '').replace(/"/g, '""')}"`;
                
                csvContent += `${r.date},${r.walk_grade},${escapedWalkNum},${escapedLeader},${escapedComments}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const downloadLink = document.createElement("a");
            downloadLink.setAttribute("href", encodedUri);
            downloadLink.setAttribute("download", "walk_bookings_export.csv");
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        });

        // Storage Purge Action Handlers
        document.getElementById('btn-purge-data').addEventListener('click', () => {
            if (confirm("CRITICAL ACTION: Are you sure you want to completely erase all registered booking histories? This cannot be undone.")) {
                localStorage.removeItem('walk_registry_db');
                persistBookings({});
            }
        });

        // Timeline Pagination Links
        document.getElementById('btn-prev').addEventListener('click', () => {
            calendarPivotDate.setMonth(calendarPivotDate.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById('btn-next').addEventListener('click', () => {
            calendarPivotDate.setMonth(calendarPivotDate.getMonth() + 1);
            renderCalendar();
        });

        document.getElementById('btn-close-modal').addEventListener('click', hideRegistrationModal);

        // Core Initialize Sequence Trigger
        renderCalendar();
        renderTable();
    </script>
</body>
</html>
